<title>The Doll Man - a pixel horror adventure you can play inside an X post</title>

<!-- ===== X (Twitter) PLAYER CARD =====
     X reads these tags when someone posts a link to THIS page.
     All links point to the live address https://splazepine.github.io/the-doll-man-play/
     They must be full https:// links, because X does not run JavaScript.
     publish.py also bumps the version number on EVERY link at once (X and browsers cache). -->
<meta name="twitter:card" content="player">
<meta name="twitter:title" content="The Doll Man 🎎">
<meta name="twitter:description" content="Wake up in a life-size dollhouse. Find the way out before you become his next doll. Play it right here in the post.">
<meta name="twitter:image" content="https://splazepine.github.io/the-doll-man-play/card.png?v=1">
<meta name="twitter:image:alt" content="Pixel art: a dark Victorian dollhouse with glowing windows at night, and the Doll Man in front of it, a tall figure with a cracked porcelain mask, a stitched smile, a top hat full of pins and a patchwork coat">
<meta name="twitter:player" content="https://splazepine.github.io/the-doll-man-play/game.html?v=1">
<meta name="twitter:player:width" content="480">
<meta name="twitter:player:height" content="480">

<!-- Open Graph tags: other apps (Discord, iMessage, etc.) read these -->
<meta property="og:type" content="website">
<meta property="og:title" content="The Doll Man 🎎">
<meta property="og:description" content="A pixel point-and-click horror adventure: escape a life-size dollhouse before the Doll Man finishes his work.">
<meta property="og:image" content="https://splazepine.github.io/the-doll-man-play/card.png?v=1">
<meta property="og:url" content="https://splazepine.github.io/the-doll-man-play/?v=1">

<body>
<main>
  <h1>The Doll Man 🎎</h1>
  <p>Tap things to look at them and use them. Long-press (or right-click) for look, use or talk. Tap an item, then a thing, to use it. Stuck? Tap the candle for a hint.</p>
  <!-- People who open the link in a normal browser still get to play. -->
  <iframe class="frame" src="game.html?v=1" title="The Doll Man game"
          sandbox="allow-popups allow-same-origin allow-scripts allow-presentation"></iframe>
